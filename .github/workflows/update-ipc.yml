# .github/workflows/update-ipc.yml
# Atualiza data/ipc-anual.json todos os meses: o INE divulga o IPC do mes
# anterior por volta do dia 10-12, por isso o workflow corre a dia 15.
# Alem dos anos fechados (dezembro), grava o valor provisorio do ano corrente
# (media dos ultimos 12 meses ate ao ultimo mes disponivel).
# O workflow_dispatch permite correr manualmente.

name: Atualizar IPC (INE)

on:
  schedule:
    - cron: "0 9 15 * *"   # dia 15 de cada mes, 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Atualizar dados do IPC
        run: python pipeline/update_ipc.py

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ipc-anual.json
          if git diff --cached --quiet; then
            echo "Sem alteracoes."
          else
            git commit -m "Atualiza IPC (INE) - $(date +%Y-%m)"
            git push
          fi
