# .github/workflows/update-ipc.yml
# Atualiza data/ipc-anual.json uma vez por ano, depois de o INE publicar
# a inflacao media anual do ano anterior (destaque de meados de janeiro).
# Corre a 20 de janeiro; o workflow_dispatch permite correr manualmente.

name: Atualizar IPC anual (INE)

on:
  schedule:
    - cron: "0 9 20 1 *"   # 20 de janeiro, 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Atualizar dados do IPC
        run: python pipeline/update_ipc.py

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ipc-anual.json
          if git diff --cached --quiet; then
            echo "Sem alteracoes."
          else
            git commit -m "Atualiza IPC anual (INE) - $(date +%Y)"
            git push
          fi
